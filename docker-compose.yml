services:
  app:
    build: .
    container_name: isef-control-gastos
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-isef_docker_session_secret_2026_super_secure}
      - DB_PATH=/app/data/gastos.db
      - LIMITE_EFECTIVO_DEDUCIBLE=${LIMITE_EFECTIVO_DEDUCIBLE:-2000.00}
    volumes:
      - isef_datos:/app/data
    restart: unless-stopped

volumes:
  isef_datos:
    driver: local
